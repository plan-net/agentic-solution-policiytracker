proxy_location: EveryNode
http_options:
  host: 0.0.0.0
  port: 8001
grpc_options:
  port: 9000
  grpc_servicer_functions: []
logging_config:
  encoding: TEXT
  log_level: INFO
  logs_dir: null
  enable_access_log: true
applications:
- name: flow1b-bulk-auto
  route_prefix: /data-ingestion-bulk-auto
  import_path: src.flows.data_ingestion_bulk_auto.app:bulk_auto_app
  runtime_env:
    env_vars:
      PYTHONPATH: .
      LOG_LEVEL: INFO
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: politicalmonitoring.v3
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGFUSE_PUBLIC_KEY: pk-lf-d52922a4-6f16-4fc5-98f0-6c20cffbeb17
      LANGFUSE_SECRET_KEY: sk-lf-e041023c-b500-439a-9dd8-f30935d5b9ad
      LANGFUSE_HOST: http://localhost:3001
  ray_actor_options:
    num_cpus: 3
    memory: 3000000000
  autoscaling_config:
    min_replicas: 1
    max_replicas: 3
    target_num_ongoing_requests_per_replica: 1
- name: flow1d-raw-converter
  route_prefix: /raw-converter
  import_path: src.flows.documents_raw_converter.app:app
  runtime_env:
    env_vars:
      PYTHONPATH: .
      LOG_LEVEL: INFO
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: politicalmonitoring.v3
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGFUSE_PUBLIC_KEY: pk-lf-d52922a4-6f16-4fc5-98f0-6c20cffbeb17
      LANGFUSE_SECRET_KEY: sk-lf-e041023c-b500-439a-9dd8-f30935d5b9ad
      LANGFUSE_HOST: http://localhost:3001
  ray_actor_options:
    num_cpus: 2
    memory: 2500000000
  autoscaling_config:
    min_replicas: 1
    max_replicas: 3
    target_num_ongoing_requests_per_replica: 1
