  #     - STREAMING_ENABLED=true
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   volumes:
  #     - open_webui_data:/app/backend/data
  #   restart: unless-stopped

  # ============================================================================
  # API GATEWAY & COST TRACKING INFRASTRUCTURE
  # ============================================================================

  # etcd - Configuration storage for APISIX
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: policiytracker-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd-data
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=default=http://etcd:2380
      - --name=default
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache APISIX - API Gateway
  apisix:
    image: apache/apisix:2.15.0-alpine
    container_name: policiytracker-apisix
    depends_on:
      etcd:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "9080:9080"  # HTTP Gateway
      - "9443:9443"  # HTTPS Gateway
      - "9180:9180"  # Admin API
    volumes:
      - ./apisix/config-2.15.yaml:/usr/local/apisix/conf/config.yaml
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml
      - ./apisix/plugins/llm-cost-tracker.lua:/usr/local/apisix/apisix/plugins/llm-cost-tracker.lua:ro
      - ./apisix/plugins/llm-cost-tracker:/usr/local/apisix/apisix/plugins/llm-cost-tracker:ro
      - ./apisix/plugins/api-request-tracker.lua:/usr/local/apisix/apisix/plugins/api-request-tracker.lua:ro
      - ./apisix/config:/usr/local/apisix/conf/custom:ro
      - apisix_logs:/usr/local/apisix/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9092/v1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # APISIX Dashboard - Management UI
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: policiytracker-apisix-dashboard
    depends_on:
      - apisix
    ports:
      - "9000:9000"
    environment:
      - APISIX_API_URL=http://localhost:9180/apisix/admin
    volumes:
      - ./apisix/dashboard_conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # TimescaleDB - Time-series database for cost tracking
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: policiytracker-timescaledb
    environment:
      POSTGRES_DB: llm_costs
      POSTGRES_USER: timescale
      POSTGRES_PASSWORD: timescale_secure_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./apisix/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timescale -d llm_costs"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cost Analytics API - FastAPI service for cost queries
  cost-analytics:
    build:
      context: .
      dockerfile: ./apisix/analytics/Dockerfile
    container_name: policiytracker-cost-analytics
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8090:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://timescale:timescale_secure_password@timescaledb:5432/llm_costs
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Grafana - Cost Analytics Dashboard
  grafana:
    image: grafana/grafana:11.3.0
    container_name: policiytracker-grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  azurite_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  airflow_postgres_data:
  airflow_logs:
  # open_webui_data:  # DISABLED - Open WebUI no longer used
  # LangFuse v3 volumes
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data:
  # API Gateway & Cost Tracking volumes
  etcd_data:
  apisix_logs:
  timescaledb_data:
  grafana_data:

networks:
  default:
    name: policiytracker-network