#
# Apache APISIX Configuration for APISIX 2.15.x
#

apisix:
  node_listen: 9080
  enable_control: true
  control:
    ip: "0.0.0.0"
    port: 9092
  enable_admin: true
  admin_listen:
    ip: "0.0.0.0"
    port: 9180

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30
  admin:
    admin_key:
      - name: "admin"
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
    allow_admin:
      - 0.0.0.0/0

plugins:
  - api-breaker
  - limit-req
  - proxy-rewrite
  - response-rewrite
  - prometheus
  - request-id
  - serverless-pre-function
  - llm-cost-tracker

# Custom plugin path
extra_lua_path: "/usr/local/apisix/apisix/plugins/?.lua"
extra_lua_cpath: "/usr/local/apisix/apisix/plugins/?.so"

# Plugin attributes (global config for plugins)
plugin_attr:
  llm-cost-tracker:
    db_host: "timescaledb"
    db_port: 5432
    db_name: "llm_costs"
    db_user: "timescale"
    db_password: "timescale_secure_password"
    batch_size: 10
    flush_interval: 5.0
    log_debug: true

nginx_config:
  error_log: "/usr/local/apisix/logs/error.log"
  error_log_level: "info"
  http:
    access_log: "/usr/local/apisix/logs/access.log"
    enable_access_log: true
