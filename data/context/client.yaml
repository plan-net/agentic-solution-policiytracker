# Client Context for Political Monitoring Agent
# Version: 4 - Regulatory/Political Focus with Bilingual Terms
# 
# HYPOTHESIS: Adding German terms may improve capture from authoritative
# German legal/political sources (Bundesregierung, Bundestag, ministries)
#
# KEY CHANGES from v2:
# - Removed competitor names (ASOS, Klarna, etc.) - these pull business news
# - Added regulatory institutions (DE + EU)
# - Added legislative vocabulary (DE + EN)
# - topic_patterns now regulatory-focused
# - company_terms now focused on regulatory context, not market position

