# =============================================================================
# BUSINESS MODEL (unchanged)
# =============================================================================

business_model:
  description: "Online marketplace connecting consumers with fashion brands, operating B2C sales and enabling third-party sellers across EU markets"
  
  key_activities:
    - "Operates online marketplace with third-party sellers"
    - "Direct B2C sales of fashion and apparel"
    - "Offers payment options including deferred payment / buy-now-pay-later"
    - "Cross-border shipping within EU"
    - "Uses algorithms for product recommendations and personalization"
    - "Processes customer data for marketing and operations"
    - "Sources and ships products from various origins including third countries"

# =============================================================================
# REGULATORY RELEVANCE (unchanged structure)
# =============================================================================

regulatory_relevance:
  
  high_relevance:
    - area: "Platform and marketplace regulation"
      why: "Core business is operating an online marketplace"
      watch_for:
        - "Obligations for online platforms and marketplaces"
        - "Liability for third-party seller content and products"
        - "Transparency requirements for platforms"
        - "Enforcement actions against similar platforms"
      
    - area: "Consumer protection in e-commerce"
      why: "B2C sales are core business"
      watch_for:
        - "Online consumer rights and returns"
        - "Pricing transparency and dark patterns"
        - "Consumer credit and payment regulations"
        - "Buy-now-pay-later and deferred payment rules"
        - "Consumer redress and dispute resolution"
      
    - area: "Product safety and market surveillance"
      why: "Liability exposure for products sold through platform"
      watch_for:
        - "Product safety requirements for online sales"
        - "Marketplace liability for unsafe products"
        - "Import controls and customs for e-commerce"
        - "Third-country seller compliance"
        - "CE marking and conformity"
      
    - area: "Data protection and privacy"
      why: "Extensive customer data processing for operations and marketing"
      watch_for:
        - "Data protection enforcement trends"
        - "Cross-border data transfers"
        - "Marketing and consent requirements"
        - "Customer profiling and personalization rules"
        
    - area: "Payment services regulation"
      why: "Offers payment options as part of checkout"
      watch_for:
        - "Payment service regulations"
        - "Consumer credit requirements"
        - "Credit checks and affordability assessments"
        - "Payment provider obligations"

  medium_relevance:
    - area: "Competition and antitrust"
      why: "Market position and platform practices may attract scrutiny"
      watch_for:
        - "Platform competition enforcement"
        - "Self-preferencing and fairness rules"
        - "Merger and acquisition rules"
        
    - area: "Cybersecurity requirements"
      why: "Digital infrastructure and customer data require security"
      watch_for:
        - "Cybersecurity obligations for digital businesses"
        - "Incident reporting requirements"
        - "Critical infrastructure designations"
        
    - area: "Algorithmic and AI regulation"
      why: "Uses algorithms for recommendations and decisions"
      watch_for:
        - "AI transparency and explainability"
        - "Algorithmic fairness requirements"
        - "Automated decision-making rules"
        
    - area: "Cross-border trade within EU"
      why: "Ships across EU member states"
      watch_for:
        - "Geoblocking and price discrimination"
        - "Cross-border consumer protection"
        - "VAT and customs for e-commerce"

  monitor:
    - area: "Sustainability and environmental regulation"
      why: "Fashion industry increasingly subject to sustainability rules"
      watch_for:
        - "Textile-specific environmental rules"
        - "Green claims and greenwashing"
        - "Circular economy requirements"
        - "Supply chain due diligence"
        
    - area: "Employment and gig economy"
      why: "Logistics and delivery workforce"
      watch_for:
        - "Platform worker classification"
        - "Gig economy regulation"

# =============================================================================
# COMPETITIVE CONTEXT (unchanged)
# =============================================================================

competitive_awareness:
  principle: "Enforcement against or regulatory treatment of similar platforms may set precedents"
  
  similar_businesses:
    - "Other EU e-commerce platforms and marketplaces"
    - "Fashion retail platforms"
    - "Companies offering BNPL/deferred payment"
    
  third_country_platforms:
    relevance: "Regulatory treatment creates competitive context"
    examples:
      - "Low-cost platforms shipping from third countries"
      - "Enforcement for product safety or customs compliance"
      - "Level playing field measures"

