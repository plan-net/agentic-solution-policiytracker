              name: Tagesordnungen
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/anhoerungen
              name: Anhörungen
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/beschlussempfehlungen
              name: Beschlussempfehlungen
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/protokolle
              name: Protokolle (öffentliche Sitzungen)
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/mitglieder
              name: Mitglieder
              depth: 1
            # Alternate path /wirtschaft redirects to committee
            - path: /wirtschaft
              name: Wirtschaft (Shortcut)
              depth: 1
          follow_pagination: true
          max_pages: 5

      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.bundestag.de/service-sitemap-bundestagde-sitemap_index.xml
          include_patterns:
            # Committee-specific content
            - "/ausschuesse/a09_wirtschaft/*"
            - "/wirtschaft*"
            # Parliamentary documents related to economy
            - "/dokumente/*wirtschaft*"
            - "/presse/hib/*wirtschaft*"
          exclude_patterns:
            - "*.pdf"
            - "/mediathek/*"
            - "/services/*"
            - "/abgeordnete/*"
          max_urls: 300

