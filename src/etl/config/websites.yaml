# Website Discovery Configuration
# Policy Tracker - German Government & Political Websites

websites:
  # Federal Government (Bundesregierung)
  bundesregierung:
    domain: bundesregierung.de
    name: Bundesregierung
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            - url: https://www.bundesregierung.de/service/rss/breg-de/1151242/feed.xml
              category: kompakt  # Press releases, articles, speeches, interviews, government statements
            - url: https://www.bundesregierung.de/service/rss/breg-de/1151244/feed.xml
              category: pressemitteilungen  # Latest press releases
            - url: https://www.bundesregierung.de/service/rss/breg-de/1151246/feed.xml
              category: artikel  # Latest articles
            - url: https://www.bundesregierung.de/service/rss/breg-de/2318648/feed.xml
              category: bulletin  # Latest bulletins
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            # News sections
            - path: /breg-de/aktuelles
              name: Aktuelles (Übersicht)
              depth: 1
            - path: /breg-de/aktuelles/pressemitteilungen
              name: Pressemitteilungen
              depth: 2
            - path: /breg-de/aktuelles/pressekonferenzen-und-reden
              name: Pressekonferenzen und Reden
              depth: 2
            - path: /breg-de/aktuelles/artikel
              name: Artikel
              depth: 2
            # Government sections
            - path: /breg-de/schwerpunkte
              name: Schwerpunkte
              depth: 1
            - path: /breg-de/bundesregierung
              name: Bundesregierung
              depth: 1
            - path: /breg-de/bundesregierung/bundeskabinett
              name: Bundeskabinett
              depth: 2
            - path: /breg-de/bundesregierung/kabinettsthemen
              name: Kabinettsthemen
              depth: 2
          follow_pagination: true
          max_pages: 10

      - type: sitemap
        priority: 3
        config:
          # Using actual sitemap index from robots.txt
          sitemap_url: https://www.bundesregierung.de/service-sitemap-4d4e784d6cdbde1a37901f96601df03f-sitemap_index.xml
          include_patterns:
            - "/breg-de/aktuelles/*"
            - "/breg-de/schwerpunkte/*"
            - "/breg-de/bundesregierung/*"
          exclude_patterns:
            - "*.pdf"
            - "*.jpg"
            - "*.png"
            - "/breg-de/mediathek/*"
            - "/breg-de/service/*"
          max_urls: 500

  # Ministry of Justice (Bundesministerium der Justiz)
  bmjv:
    domain: bmjv.de
    name: Bundesministerium der Justiz
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # Working RSS feeds (verified Dec 2025)
            - url: https://www.bmjv.de/SiteGlobals/Functions/RSSNewsfeed/DE/RSSNewsfeed/RSSNewsfeedPressemitteilungen.xml
              category: pressemitteilungen  # Press releases
            - url: https://www.bmjv.de/SiteGlobals/Functions/RSSNewsfeed/DE/RSSNewsfeed/RSSNewsfeedGesetzgebungsverfahren.xml
              category: gesetzgebungsverfahren  # Legislative procedures
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            # Press section
            - path: /DE/presse/presse_node.html
              name: Presse (Übersicht)
              depth: 1
            # Themen (Topics) - main policy areas
            - path: /DE/themen/digitales
              name: Digitales
              depth: 2
            - path: /DE/themen/verbraucherschutz
              name: Verbraucherschutz
              depth: 2
            - path: /DE/themen/wirtschaft_finanzen
              name: Wirtschaft und Finanzen
              depth: 2
            - path: /DE/themen/gesellschaft_familie
              name: Gesellschaft und Familie
              depth: 2
            - path: /DE/themen/buerokratieabbau_rechtsetzung
