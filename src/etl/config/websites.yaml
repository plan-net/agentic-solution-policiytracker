# =============================================================================
# SOURCE NOTES
# =============================================================================
# 
# NOT INCLUDED - Manual/subscription only:
# - Berliner Termindienst (berliner-termindienst.de)
#   - No API, no RSS
#   - Paid subscription with weekly email newsletter
#   - Use for manual situational awareness only
#
# DIP API (separate integration):
# - Bundestag DIP API provides: Drucksachen, Plenarprotokolle, Vorgänge
# - This config focuses on content NOT in DIP:
#   - Referentenentwürfe (ministry drafts)
#   - Stellungnahmen (consultation responses)
#   - Ministry-specific policy pages
#   - EU Parliament procedures (OEIL)
#
# OEIL RSS Generation:
# - RSS feeds must be manually generated from saved searches
# - Go to: https://oeil.europarl.europa.eu/oeil/en/search/procedures
# - Filter by: Committee (ITRE, IMCO, LIBE), Subject codes, Date range
# - Click Export > RSS to get feed URL
# - SPARQL API for bulk data: http://publications.europa.eu/webapi/rdf/sparql
