# Website Discovery Configuration v2
# Policy Tracker - German Government, EU Parliament & Political Websites
# Updated: December 2025
# Changes from v1:
#   - Added EU Legislative Observatory (OEIL) for EU-level tracking
#   - Enhanced ministry sections with legislation, leadership, org pages
#   - Consolidated Bundestag committee RSS feeds (without drucksachen)
#   - Added BMF (Finance), BMUV (Environment) ministries
#   - Improved section coverage for pre-parliamentary content

websites:

  # =============================================================================
  # EU PARLIAMENT - LEGISLATIVE OBSERVATORY (OEIL)
  # =============================================================================
  # Tracks EU legislative procedures from EP perspective
  # Complements German national sources with EU-level legislation
  # Key for: AI Act, DSA, DMA, Data Act, Cyber Resilience Act tracking
  
  oeil:
    domain: oeil.europarl.europa.eu
    name: EU Legislative Observatory (OEIL)
    language: en  # Primary language (also available in French)
    enabled: true
    
    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # NOTE: RSS feeds must be generated from saved searches on OEIL
            # Filter by committees: ITRE, IMCO, LIBE and subject codes
            # Generate at: https://oeil.europarl.europa.eu/oeil/en/search/procedures
            # After creating search, click Export > RSS
            
            # Placeholder URLs - replace with actual generated RSS feeds:
            # - url: [OEIL RSS for ITRE digital policy procedures]
            #   category: itre_digital
            # - url: [OEIL RSS for IMCO digital services/consumer protection]
            #   category: imco_digital
            # - url: [OEIL RSS for LIBE data protection procedures]
            #   category: libe_dataprotection
          max_items_per_feed: 50
          
      - type: section
        priority: 2
        config:
          sections:
            # Part-session calendar (plenary agendas)
            - path: /oeil/en/events/part-session
              name: Part-Session Calendar
              depth: 2
            # Committee-specific procedure searches
            - path: /oeil/en/search/procedures
              name: Procedure Search
              depth: 1
          follow_pagination: true
          max_pages: 10
          
    # SPARQL API for bulk data retrieval (separate from web crawling)
    metadata:
      api_available: true
      api_type: sparql
      api_endpoint: http://publications.europa.eu/webapi/rdf/sparql
      alternative_api: https://data.europarl.europa.eu/en/developer-corner/opendata-api
      key_committees:
        - code: ITRE
          name: Industry, Research and Energy
          focus: Digital policy, AI, semiconductors
        - code: IMCO
          name: Internal Market and Consumer Protection
          focus: DSA, DMA, digital services, e-commerce
        - code: LIBE
          name: Civil Liberties, Justice and Home Affairs
          focus: Data protection, privacy, GDPR
      subject_codes:
        - code: "3.30.06"
          name: Information and communication technologies
        - code: "1.20.09"
          name: Protection of privacy and data protection
        - code: "3.30.25"
          name: International information networks, internet
      procedure_types:
        - code: COD
          name: Ordinary legislative procedure (codecision)
        - code: NLE
          name: Non-legislative enactments
        - code: INI
          name: Own-initiative procedure

  # =============================================================================
  # BUNDESTAG - CONSOLIDATED COMMITTEE MONITORING
  # =============================================================================
  # Single entry for all relevant Bundestag committee RSS feeds
  # Excludes drucksachen (available via DIP API)
  
  bundestag_committees:
    domain: bundestag.de
    name: Bundestag Ausschüsse (Consolidated)
    language: de
    enabled: true
    
    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # === GENERAL BUNDESTAG FEEDS ===
            - url: https://www.bundestag.de/static/appdata/includes/rss/hib.rss
              category: hib_kurzmeldungen  # Committee news, bill explanations
            - url: https://www.bundestag.de/static/appdata/includes/rss/tagesordnungen.rss
              category: tagesordnungen  # Committee meeting agendas
            - url: https://www.bundestag.de/static/appdata/includes/rss/pressemitteilungen.rss
              category: pressemitteilungen  # Official press releases
            
            # === COMMITTEE-SPECIFIC TOPIC FEEDS ===
            - url: https://www.bundestag.de/static/appdata/includes/rss/digitales.rss
              category: digitales  # Digital/modernization news (Ausschuss Digitales)
            - url: https://www.bundestag.de/static/appdata/includes/rss/inneres.rss
              category: inneres  # Interior affairs, IT security (Innenausschuss)
            - url: https://www.bundestag.de/static/appdata/includes/rss/recht.rss
              category: recht  # Law and consumer protection (Rechtsausschuss)
            - url: https://www.bundestag.de/static/appdata/includes/rss/wirtschaft.rss
              category: wirtschaft  # Economy and energy (Wirtschaftsausschuss)
            - url: https://www.bundestag.de/static/appdata/includes/rss/arbeitsoziales.rss
              category: arbeit_soziales  # Labor and social policy (Ausschuss Arbeit/Soziales)
            - url: https://www.bundestag.de/static/appdata/includes/rss/umwelt.rss
              category: umwelt  # Environment, climate (Umweltausschuss)
            - url: https://www.bundestag.de/static/appdata/includes/rss/finanzen.rss
              category: finanzen  # Finance policy (Finanzausschuss)
            - url: https://www.bundestag.de/static/appdata/includes/rss/eu.rss
              category: eu  # EU affairs (Europaausschuss)
          max_items_per_feed: 50
          
      - type: section
        priority: 2
        config:
          sections:
            # === COMMITTEE PAGES ===
            # Ausschuss für Digitales und Staatsmodernisierung
            - path: /digitales
              name: Ausschuss Digitales (Übersicht)
              depth: 1
            - path: /ausschuesse/a23_digitales
              name: Ausschuss Digitales (Detail)
              depth: 2
            - path: /ausschuesse/a23_digitales/anhoerungen
              name: Digitales - Anhörungen
              depth: 2
            - path: /ausschuesse/a23_digitales/tagesordnungen
              name: Digitales - Tagesordnungen
              depth: 2
              
            # Ausschuss für Wirtschaft und Energie
            - path: /wirtschaft
              name: Ausschuss Wirtschaft (Übersicht)
              depth: 1
            - path: /ausschuesse/a09_wirtschaft
              name: Ausschuss Wirtschaft (Detail)
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/anhoerungen
              name: Wirtschaft - Anhörungen
              depth: 2
            - path: /ausschuesse/a09_wirtschaft/tagesordnungen
              name: Wirtschaft - Tagesordnungen
              depth: 2
              
            # Ausschuss für Recht und Verbraucherschutz
            - path: /recht
              name: Ausschuss Recht (Übersicht)
              depth: 1
            - path: /ausschuesse/a06_recht
              name: Ausschuss Recht (Detail)
              depth: 2
            - path: /ausschuesse/a06_recht/anhoerungen
              name: Recht - Anhörungen
              depth: 2
              
            # Innenausschuss
            - path: /inneres
              name: Innenausschuss (Übersicht)
              depth: 1
            - path: /ausschuesse/a04_innen
              name: Innenausschuss (Detail)
              depth: 2
            - path: /ausschuesse/a04_innen/anhoerungen
              name: Inneres - Anhörungen
              depth: 2
              
            # Ausschuss für Arbeit und Soziales
            - path: /arbeit
              name: Ausschuss Arbeit/Soziales (Übersicht)
              depth: 1
            - path: /ausschuesse/a11_arbeit_soziales
              name: Ausschuss Arbeit/Soziales (Detail)
              depth: 2
            - path: /ausschuesse/a11_arbeit_soziales/anhoerungen
              name: Arbeit/Soziales - Anhörungen
              depth: 2
              
            # Ausschuss für Umwelt, Naturschutz, nukleare Sicherheit
            - path: /umwelt
              name: Ausschuss Umwelt (Übersicht)
              depth: 1
            - path: /ausschuesse/a16_umwelt
              name: Ausschuss Umwelt (Detail)
              depth: 2
              
            # Finanzausschuss
            - path: /finanzen
              name: Finanzausschuss (Übersicht)
              depth: 1
            - path: /ausschuesse/a07_finanzen
              name: Finanzausschuss (Detail)
              depth: 2
              
            # Europaausschuss
            - path: /europa
              name: Europaausschuss (Übersicht)
              depth: 1
            - path: /ausschuesse/a21_europa
              name: Europaausschuss (Detail)
              depth: 2
          follow_pagination: true
          max_pages: 5
          
      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.bundestag.de/service-sitemap-bundestagde-sitemap_index.xml
          include_patterns:
            - "/ausschuesse/*"
            - "/digitales*"
            - "/wirtschaft*"
            - "/recht*"
            - "/inneres*"
            - "/arbeit*"
            - "/umwelt*"
            - "/finanzen*"
            - "/europa*"
            - "/presse/hib/*"
          exclude_patterns:
            - "*.pdf"
            - "/mediathek/*"
            - "/abgeordnete/*"
            - "/dokumente/drucksachen/*"  # Use DIP API for Drucksachen
          max_urls: 500

