  # Bundestag - Committee for Economy and Energy (Ausschuss für Wirtschaft und Energie)
  # Note: This is a section of bundestag.de, configured as a focused website entry
  bundestag_wirtschaft:
    domain: bundestag.de
    name: Bundestag Ausschuss für Wirtschaft und Energie
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # Topic-specific RSS feed for "Wirtschaft und Energie" covering committee activities
            - url: https://www.bundestag.de/static/appdata/includes/rss/wirtschaft.rss
              category: wirtschaft_und_energie  # All news related to economy and energy topics
            # General committee agenda feed (covers all committees, will be filtered)
            - url: https://www.bundestag.de/static/appdata/includes/rss/tagesordnungen.rss
              category: tagesordnungen  # Committee meeting agendas
            # Short news bulletins (hib) - often contains committee reports
            - url: https://www.bundestag.de/static/appdata/includes/rss/hib.rss
              category: kurzmeldungen  # Brief news items including committee reports
            # Official parliamentary documents
            - url: https://www.bundestag.de/static/appdata/includes/rss/drucksachen.rss
              category: drucksachen  # Official parliamentary printed documents
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            # Main committee page
            - path: /ausschuesse/a09_wirtschaft
              name: Ausschuss für Wirtschaft und Energie (Übersicht)
              depth: 1
            # Committee sub-sections
