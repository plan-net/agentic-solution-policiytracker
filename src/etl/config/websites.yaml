  # MINISTRY FOR HOUSING (BMWSB)
  # =============================================================================
  # Key for: Building regulations, urban development, construction standards
  
  bmwsb:
    domain: bmwsb.bund.de
    name: Bundesministerium für Wohnen, Stadtentwicklung und Bauwesen
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # Note: RSS page https://www.bmwsb.bund.de/Webs/BMWSB/DE/service/rss/rss-node.html
            - url: https://www.bmwsb.bund.de/DE/tools-services/rssfeed/_functions/rssnewsfeed.xml
              category: allgemein
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            # === LEGISLATION ===
            - path: /Webs/BMWSB/DE/themen/bauen/bauwesen/gesetzgebung-leitfaeden/gesetzgebung-leitfaeden-node.html
              name: Gesetzgebung und Leitfäden
              depth: 2
              content_type: legislation
              
            # === KEY POLICY AREAS ===
            - path: /Webs/BMWSB/DE/themen/wohnen/wohnen-node.html
              name: Wohnen
              depth: 2
            - path: /Webs/BMWSB/DE/themen/bauen/bauen-node.html
              name: Bauen
              depth: 2
            - path: /Webs/BMWSB/DE/themen/stadtentwicklung/stadtentwicklung-node.html
              name: Stadtentwicklung
              depth: 2
              
            # === ORGANIZATION ===
            - path: /DE/ministerium/ministerium_node.html
              name: Ministerium (Übersicht)
              depth: 1
              
            # === PRESS ===
            - path: /Webs/BMWSB/DE/service/presse/presse-node.html
              name: Presse
              depth: 2
          follow_pagination: true
          max_pages: 5

      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.bmwsb.bund.de/Sitemap_Index.xml
          include_patterns:
            - "/DE/tools-services/presse/*"
            - "/DE/ministerium/*"
            - "/Webs/BMWSB/DE/themen/*"
            - "/SharedDocs/pressemitteilungen/*"
          exclude_patterns:
            - "*.pdf"
            - "/DE/tools-services/publikationen/*"
          max_urls: 300

  # =============================================================================
  # MINISTRY OF FINANCE (BMF)
  # =============================================================================
  # Key for: Tax policy, financial regulation, customs, public finances
  
  bmf:
    domain: bundesfinanzministerium.de
    name: Bundesministerium der Finanzen
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            # Note: RSS page https://www.bundesfinanzministerium.de/Web/DE/Service/Abonnements/Rss/rss.html
            # Specific feed URLs to be verified
            - url: https://www.bundesfinanzministerium.de/SiteGlobals/Functions/RSSFeed/DE/RSSNewsfeed/RSSNewsfeed.xml
              category: allgemein
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            # === LEGISLATION (HIGHEST PRIORITY) ===
            - path: /Web/DE/Service/Gesetze_Gesetzesvorhaben/Gesetze_Gesetzgebungsvorhaben.html
              name: Gesetze und Gesetzesvorhaben
              depth: 2
              content_type: legislation
              
            # === KEY POLICY AREAS ===
            - path: /Web/DE/Themen/Steuern/steuern.html
              name: Steuern
              depth: 2
            - path: /Web/DE/Themen/Internationales_Finanzmarkt/internationales_finanzmarkt.html
              name: Internationales und Finanzmarkt
              depth: 2
            - path: /Web/DE/Themen/Zoll/zoll.html
              name: Zoll
              depth: 2
            - path: /Web/DE/Themen/Oeffentliche_Finanzen/oeffentliche_finanzen.html
              name: Öffentliche Finanzen
              depth: 2
              
            # === ORGANIZATION ===
            - path: /Web/DE/Ministerium/ministerium.html
              name: Ministerium (Übersicht)
              depth: 1
            - path: /Web/DE/Ministerium/Leitung/leitung.html
              name: Leitung
              depth: 1
          follow_pagination: true
          max_pages: 5

  # =============================================================================
  # POLITICAL PARTIES
  # =============================================================================
  
  cdu:
    domain: cdu.de
    name: CDU Deutschland
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            - url: https://www.cdu.de/rss.xml
              category: general
          max_items_per_feed: 30

      - type: section
        priority: 2
        config:
          sections:
            - path: /aktuelles
              name: Aktuelles
              depth: 2
            - path: /themen
              name: Themen
              depth: 1
            - path: /pressemitteilungen
              name: Pressemitteilungen
              depth: 2
          follow_pagination: true
          max_pages: 10

      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.cdu.de/sitemap.xml
          include_patterns:
            - "/aktuelles/*"
            - "/themen/*"
            - "/pressemitteilungen/*"
          exclude_patterns:
            - "*.pdf"
          max_urls: 200

  bsw:
    domain: bsw-vg.de
    name: Bündnis Sahra Wagenknecht
    language: de
    enabled: true

    discovery_strategies:
      - type: section
        priority: 1
        config:
          sections:
            - path: /aktuelles
              name: Aktuelles
              depth: 2
            - path: /pressemitteilungen
              name: Pressemitteilungen
              depth: 2
          follow_pagination: true
          max_pages: 5

      - type: sitemap
        priority: 2
        config:
          sitemap_url: https://bsw-vg.de/sitemap.xml
          include_patterns:
            - "/aktuelles/*"
            - "/pressemitteilungen/*"
          max_urls: 100


# =============================================================================
# GLOBAL DISCOVERY SETTINGS
# =============================================================================

discovery_settings:
  # Rate limiting
  request_delay_seconds: 1.5
  max_concurrent_requests: 3
  request_timeout_seconds: 30

  # User agent
  user_agent: "PolicyTracker/1.0 (Political Monitoring Research; https://example.com/bot)"

  # Robots.txt compliance
  respect_robots_txt: true


# =============================================================================
