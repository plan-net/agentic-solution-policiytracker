        config:
          sections:
            - path: /digitales
              name: Ausschuss für Digitales (Übersicht)
              depth: 1
            - path: /ausschuesse/a23_digitales
              name: Ausschuss für Digitales (Archiv-Pfad)
              depth: 2
          follow_pagination: true
          max_pages: 5

      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.bundestag.de/service-sitemap-bundestagde-sitemap_index.xml
          include_patterns:
            - "/digitales*"
            - "/ausschuesse/*digital*"
            - "/dokumente/*digital*"
            - "/dokumente/*staatsmodernisierung*"
            - "/presse/hib/*digital*"
          exclude_patterns:
            - "*.pdf"
            - "/mediathek/*"
            - "/abgeordnete/*"
          max_urls: 300

  # Bundestag - Committee on Internal Affairs
  bundestag_inneres:
    domain: bundestag.de
    name: Bundestag Innenausschuss
    language: de
    enabled: true

    discovery_strategies:
      - type: rss
        priority: 1
        config:
          feeds:
            - url: https://www.bundestag.de/static/appdata/includes/rss/inneres.rss
              category: inneres
            - url: https://www.bundestag.de/static/appdata/includes/rss/tagesordnungen.rss
              category: tagesordnungen
            - url: https://www.bundestag.de/static/appdata/includes/rss/hib.rss
              category: kurzmeldungen
          max_items_per_feed: 50

      - type: section
        priority: 2
        config:
          sections:
            - path: /inneres
              name: Innenausschuss (Übersicht)
              depth: 1
            - path: /ausschuesse/a04_innen
              name: Innenausschuss (Archiv-Pfad)
              depth: 2
          follow_pagination: true
          max_pages: 5

      - type: sitemap
        priority: 3
        config:
          sitemap_url: https://www.bundestag.de/service-sitemap-bundestagde-sitemap_index.xml
          include_patterns:
            - "/inneres*"
            - "/ausschuesse/*innen*"
            - "/dokumente/*innen*"
            - "/dokumente/*migration*"
            - "/dokumente/*sicherheit*"
            - "/presse/hib/*innen*"
          exclude_patterns:
            - "*.pdf"
            - "/mediathek/*"
            - "/abgeordnete/*"
          max_urls: 300

# Global Discovery Settings
discovery_settings:
  # Rate limiting
  request_delay_seconds: 1.5
  max_concurrent_requests: 3
  request_timeout_seconds: 30

  # User agent
  user_agent: "PolicyTracker/1.0 (Political Monitoring Research; https://example.com/bot)"

  # Robots.txt compliance
  respect_robots_txt: true

# Relevance Filtering Configuration
filtering:
